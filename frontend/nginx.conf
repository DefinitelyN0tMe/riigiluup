# Behind the edge nginx (docker-compose.prod.yml), the browser's real scheme/IP arrive as
# X-Forwarded-Proto / X-Real-IP. Forward those through to the API instead of the internal
# edge→web connection's values: otherwise Spring builds http:// OAuth redirect_uris (→
# redirect_uri_mismatch) and the API rate-limiter buckets every SPA request under the edge's IP.
# The "" fallbacks keep this correct if the web container is ever run without an edge in front.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}
map $http_x_real_ip $fwd_real_ip {
  default $http_x_real_ip;
  ""      $remote_addr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS: the api upstream below is a variable, so its address is looked up per
  # request (cached 10 s). A static `proxy_pass http://api:8080` resolves once at startup and keeps
  # talking to the old container IP after the api is recreated by a deploy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Only what the SPA needs: the public/admin API and the admin OIDC login redirect. The previous
  # catch-all `/api-proxy/` exposed the api's whole root (actuator index, crawler pages, sitemap).
  location /api-proxy/api/ {
    set $api_up api:8080;
    rewrite ^/api-proxy(/api/.*)$ $1 break;
    proxy_pass http://$api_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $fwd_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /api-proxy/oauth2/ {
    set $api_up api:8080;
    rewrite ^/api-proxy(/oauth2/.*)$ $1 break;
    proxy_pass http://$api_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $fwd_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /api-proxy/ {
    return 404;
  }

  # Vite content-hashes /assets/*, so they are safe to cache immutably (a changed file gets a
  # new name). Everything else falls through to the SPA entrypoint.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The SPA entrypoint must be revalidated on every load: a stale cached index.html points at
  # hashed chunks that the next deploy removed, which shows a blank page. try_files below
  # internally redirects every app route here, so they all get this header.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
