spring:
  application:
    name: politico
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/politico?tcpKeepAlives=true}
    username: ${DB_USER:politico}
    password: ${DB_PASSWORD:politico}
    hikari:
      password: ${DB_PASSWORD:politico}
      username: ${DB_USER:politico}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info

politico:
  riigikogu:
    base-url: https://api.riigikogu.ee
    user-agent: "politico/0.0.1 (riigiluup@gmail.com)"
    rate-limit-per-second: 1
