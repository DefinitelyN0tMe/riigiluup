spring:
  application:
    name: politico
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/politico}
    username: ${DB_USER:politico}
    password: ${DB_PASSWORD:politico}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  # OAuth2 client (Google OIDC) is registered programmatically in AdminSecurityConfig
  # only when GOOGLE_OAUTH_CLIENT_ID is set, so an unset value doesn't break startup.

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info

politico:
  riigikogu:
    base-url: https://api.riigikogu.ee
    user-agent: "politico/0.0.1 (riigiluup@gmail.com)"
    rate-limit-per-second: 1
  schedule:
    daily-refresh-cron: "0 5 3 * * *"
    daily-refresh-zone: "Europe/Tallinn"
  admin:
    username: ${POLITICO_ADMIN_USERNAME:admin}
    password: ${POLITICO_ADMIN_PASSWORD:change-me}
    allowed-emails: ${POLITICO_ADMIN_ALLOWED_EMAILS:riigiluup@gmail.com}
