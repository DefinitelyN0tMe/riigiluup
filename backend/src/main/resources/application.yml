spring:
  application:
    name: riigiluup
  # NOTE: the scheduler pool is deliberately left at the default size 1. The @Scheduled importers
  # rely on implicit serialization: refreshVotes/refreshDaily share one AtomicBoolean (a larger pool
  # makes the 04:30 daily run SKIP for the day if 03:05 votes overruns), and several importers do
  # read-modify-write on shared tables (plenary_member, legislative_item) with no @Version. Do not
  # raise the pool without adding per-cron guards and optimistic locking first.
  profiles:
    # Bare `./gradlew bootRun` (README dev flow) runs as local; compose and prod
    # deploys always pass SPRING_PROFILES_ACTIVE explicitly.
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/riigiluup}
    username: ${DB_USER:riigiluup}
    password: ${DB_PASSWORD:riigiluup}
    hikari:
      # Explicit pool sizing so a burst of concurrent (esp. analytics) requests has headroom
      # beyond the default 10, while connection-timeout fails fast instead of queueing forever.
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: 10000
      # Cap any single statement at 30 s to prevent pathological richSearch combos
      # (all filters, cold cache) from starving the connection pool. Backfill and
      # analytics queries are still comfortably within budget; upsert paths finish
      # in <100 ms typically, and analytics aggregates are indexed to be sub-second.
      connection-init-sql: "SET statement_timeout = '30s'"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # Batch lazy to-one/collection loads so e.g. the votes list resolves bill titles
      # for a whole page in one IN-query instead of N per-row selects.
      hibernate.default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
  lifecycle:
    # Let in-flight requests / scheduled imports finish on `docker stop` instead of being killed
    # mid-transaction (which would strand an ImportRunLog row in RUNNING).
    timeout-per-shutdown-phase: 20s
  # OAuth2 client (Google OIDC) is registered programmatically in AdminSecurityConfig
  # only when GOOGLE_OAUTH_CLIENT_ID is set, so an unset value doesn't break startup.

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        # Lax (NOT Strict) — Strict would drop the session on the OIDC redirect back from Google
        # and break admin login. Lax still withholds the session cookie on cross-site POSTs,
        # which mitigates CSRF on the state-changing admin endpoints.
        same-site: lax
        http-only: true

management:
  endpoints:
    web:
      exposure:
        # Defence in depth: inside the docker network actuator is reachable without auth,
        # so only health is exposed by default. An instance that is actually scraped can
        # opt back in via MANAGEMENT_ENDPOINTS_INCLUDE=health,prometheus.
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE:health}
  metrics:
    tags:
      application: riigiluup

resilience4j:
  retry:
    instances:
      riigikogu:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          # 429 (rate limited) IS now retried, with backoff (2s → 4s between attempts, on top of the
          # client's 1.6s throttle). Measured 2026-07-23: the source 429s bursts even near 1 rps, and
          # a single 429 on a detail call was failing the entire 6-hourly votes refresh. Retrying with
          # a real wait *spaces requests out* rather than hammering, so the earlier "amplifies load"
          # concern doesn't apply — and 429s are now rare given the widened throttle.
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
        retryOnResultPredicate: com.riigiluup.ingestion.riigikogu.Retry429Predicate
  circuitbreaker:
    instances:
      riigikogu:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

riigiluup:
  cors:
    # Origins allowed to call /api/v1/admin/** with credentials. Empty = same-origin only
    # (prod serves the SPA behind the same nginx). The local profile below opens the Vite
    # dev server so the admin panel works against a bootRun backend.
    admin-origins: ${RIIGILUUP_ADMIN_CORS_ORIGINS:}
  rate-limit:
    enabled: true
    # Legacy single-rule fallback (used only if `rules` below is empty).
    per-minute: 60
    path-regex: "/api/v1/(?!admin/).*"
    # Per-IP rules with separate buckets; first match wins, so specific paths precede the catch-all.
    # files/* is generous (an MP grid loads ~50 portraits) but bounded, so the photo proxy is no
    # longer fully excluded; analytics/* is stricter because those aggregations are expensive.
    rules:
      - name: files
        pattern: "/api/v1/files/.*"
        per-minute: 300
      - name: analytics
        pattern: "/api/v1/analytics/.*"
        # The /analytics page fires ~15 of these in one burst on load, so a limit near that tripped
        # 429s on a normal reload/second visit. Results are @Cacheable (repeat hits are cheap), so a
        # generous per-IP ceiling (~8 full page loads/min) is safe and still bounds scraping.
        per-minute: 120
      - name: default
        pattern: "/api/v1/(?!admin/).*"
        per-minute: 60
  analytics:
    # Faction name substrings currently in the governing coalition — drives the coalition/
    # opposition axis of the MP scatter. Update on any change of government (SDE left in 2025).
    coalition-factions: reform,eesti 200
  riigikogu:
    base-url: https://api.riigikogu.ee
    user-agent: "riigiluup/0.0.1 (riigiluup@gmail.com)"
    rate-limit-per-second: 1
  rahvaalgatus:
    base-url: https://rahvaalgatus.ee
  umami:
    # Self-hosted analytics, reachable only inside the Docker network. The admin panel reads
    # stats through the backend (see AdminAnalyticsController), so Umami needs no public origin.
    # Blank password/website-id (the dev default) = analytics disabled, endpoint returns configured:false.
    base-url: ${UMAMI_INTERNAL_URL:http://umami:3000}
    username: ${UMAMI_ADMIN_USERNAME:admin}
    password: ${UMAMI_ADMIN_PASSWORD:}
    website-id: ${UMAMI_WEBSITE_ID:}
  files:
    # Persistent on-disk cache for proxied Riigikogu files (MP portraits). Content is immutable, so
    # it survives restarts and stops a redeploy from re-fetching every photo behind the source's
    # ~1 req/s throttle. Empty = in-memory only (dev default); prod sets FILES_CACHE_DIR to a volume.
    cache-dir: ${FILES_CACHE_DIR:}
    warm-on-startup: ${FILES_WARM_ON_STARTUP:true}
  wikidata:
    # Wikidata QIDs of Estonian parliamentary parties (+ direct predecessors). Soft allow-list:
    # a P102 membership whose party QID is outside this set is still imported, but logged WARN so
    # a curator can review it — this avoids silently dropping a legitimate small/new party while
    # still surfacing a potentially vandalised affiliation. Empty value disables the check.
    # Q738947=Reform, Q163347=Isamaa, Q1428217=Pro Patria Union, Q928652=Centre, Q794028=EKRE,
    # Q913551=SDE, Q56249403=Eesti 200, Q113677848=Parempoolsed, Q3896796=Republicans/Conservatives.
    allowed-party-qids: ${RIIGILUUP_WIKIDATA_ALLOWED_PARTY_QIDS:Q738947,Q163347,Q1428217,Q928652,Q794028,Q913551,Q56249403,Q113677848,Q3896796}
  schedule:
    # Votes AND stenograms every 6 hours at HH:05 (03:05, 09:05, 15:05, 21:05 Europe/Tallinn) — new
    # roll-calls and freshly published speeches appear within hours; the votings list is
    # date-filtered and the verbatims window is a single call, so this stays cheap.
    votes-refresh-cron: "0 5 3/6 * * *"
    # Members + committees + legislation once a day at 04:30. These change slowly, and legislation
    # now skips unchanged bills instead of re-downloading the whole catalogue every run.
    daily-refresh-cron: "0 30 4 * * *"
    daily-refresh-zone: "Europe/Tallinn"
    # MP party memberships / Q-IDs / bio enrichment from Wikidata, every 2 days at 06:45. Wikidata is
    # a separate source (its own SPARQL endpoint), so this never competes with the throttled Riigikogu
    # client; 06:45 is well after the 04:30 daily refresh.
    wikidata-refresh-cron: "0 45 6 */2 * *"
    # Re-fetch a member's detail (bio / committees / faction) at most this often.
    member-detail-max-age-days: 7
  admin:
    username: ${RIIGILUUP_ADMIN_USERNAME:admin}
    password: ${RIIGILUUP_ADMIN_PASSWORD:change-me}
    # Default empty = fail closed (no admin allowed) if the env var is unset; prod sets it in .env.
    # Never bake a personal email into the committed default (leaks PII once the repo is public).
    allowed-emails: ${RIIGILUUP_ADMIN_ALLOWED_EMAILS:}

---
spring:
  config:
    activate:
      on-profile: local
riigiluup:
  cors:
    admin-origins: http://localhost:5173
