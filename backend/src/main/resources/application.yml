spring:
  application:
    name: politico
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/politico}
    username: ${DB_USER:politico}
    password: ${DB_PASSWORD:politico}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  # OAuth2 client (Google OIDC) is registered programmatically in AdminSecurityConfig
  # only when GOOGLE_OAUTH_CLIENT_ID is set, so an unset value doesn't break startup.

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: politico

resilience4j:
  retry:
    instances:
      riigikogu:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
        # 429 responses surface as HttpClientErrorException.TooManyRequests;
        # the predicate also catches ResponseEntity-style 429s if a future
        # refactor stops throwing on 4xx.
        retryOnResultPredicate: com.politico.ingestion.riigikogu.Retry429Predicate
  circuitbreaker:
    instances:
      riigikogu:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

politico:
  rate-limit:
    enabled: true
    per-minute: 60
    path-regex: "/api/v1/(?!admin/).*"
  riigikogu:
    base-url: https://api.riigikogu.ee
    user-agent: "politico/0.0.1 (riigiluup@gmail.com)"
    rate-limit-per-second: 1
  schedule:
    daily-refresh-cron: "0 5 3 * * *"
    daily-refresh-zone: "Europe/Tallinn"
  admin:
    username: ${POLITICO_ADMIN_USERNAME:admin}
    password: ${POLITICO_ADMIN_PASSWORD:change-me}
    allowed-emails: ${POLITICO_ADMIN_ALLOWED_EMAILS:riigiluup@gmail.com}
