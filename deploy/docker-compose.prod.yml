services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: make the files_cache volume writable by api's non-root user (uid 100/gid 101 in the
  # backend image) before api starts, so the persistent disk photo cache can actually be written.
  # Idempotent — runs on every `up`, so fresh deploys work without a manual chown.
  files-cache-init:
    image: alpine:3.20
    command: sh -c "chown -R 100:101 /cache"
    restart: "no"
    volumes:
      - files_cache:/cache

  api:
    build: ../backend
    restart: unless-stopped
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "8080"
      RIIGILUUP_ADMIN_USERNAME: ${RIIGILUUP_ADMIN_USERNAME}
      RIIGILUUP_ADMIN_PASSWORD: ${RIIGILUUP_ADMIN_PASSWORD}
      RIIGILUUP_ADMIN_ALLOWED_EMAILS: ${RIIGILUUP_ADMIN_ALLOWED_EMAILS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # Read-only access to the internal Umami instance so the admin panel can show analytics
      # without exposing the Umami dashboard publicly. Blank password/id = analytics disabled.
      UMAMI_INTERNAL_URL: http://umami:3000
      UMAMI_ADMIN_USERNAME: ${UMAMI_ADMIN_USERNAME:-admin}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      # Persistent disk cache for proxied MP portraits — survives redeploys (see FileProxyController).
      FILES_CACHE_DIR: /var/cache/riigiluup/files
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseZGC -XX:+ZGenerational"
    volumes:
      - files_cache:/var/cache/riigiluup/files
    depends_on:
      db:
        condition: service_healthy
      files-cache-init:
        condition: service_completed_successfully

  web:
    build: ../frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      - api

  # Privacy-first analytics (no cookies, no personal data, self-hosted). Reuses the
  # existing Postgres (separate `umami` database) and is served on its own origin,
  # analytics.<domain>, via nginx (the prebuilt image only serves from the root path).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/riigiluup.conf:/etc/nginx/conf.d/riigiluup.conf:ro
      # Private-beta password file. MUST exist before `up` (a missing bind source makes Docker
      # create a directory and nginx will fail): htpasswd -Bc deploy/nginx/.htpasswd beta
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - api
      - web

  certbot:
    image: certbot/certbot:latest
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  db_data:
  letsencrypt:
  certbot_webroot:
  files_cache:
