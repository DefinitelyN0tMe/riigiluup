services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: make the files_cache volume writable by api's non-root user (uid 100/gid 101 in the
  # backend image) before api starts, so the persistent disk photo cache can actually be written.
  # Idempotent — runs on every `up`, so fresh deploys work without a manual chown.
  files-cache-init:
    image: alpine:3.20
    command: sh -c "chown -R 100:101 /cache"
    restart: "no"
    volumes:
      - files_cache:/cache

  api:
    build: ../backend
    restart: unless-stopped
    mem_limit: 1536m
    labels:
      # Watched by the autoheal sidecar — it issues `docker restart` if the healthcheck goes 'unhealthy'.
      autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: "8080"
      RIIGILUUP_ADMIN_USERNAME: ${RIIGILUUP_ADMIN_USERNAME}
      RIIGILUUP_ADMIN_PASSWORD: ${RIIGILUUP_ADMIN_PASSWORD}
      RIIGILUUP_ADMIN_ALLOWED_EMAILS: ${RIIGILUUP_ADMIN_ALLOWED_EMAILS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # Read-only access to the internal Umami instance so the admin panel can show analytics
      # without exposing the Umami dashboard publicly. Blank password/id = analytics disabled.
      UMAMI_INTERNAL_URL: http://umami:3000
      UMAMI_ADMIN_USERNAME: ${UMAMI_ADMIN_USERNAME:-admin}
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      # Persistent disk cache for proxied MP portraits — survives redeploys (see FileProxyController).
      FILES_CACHE_DIR: /var/cache/riigiluup/files
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseZGC -XX:+ZGenerational"
    volumes:
      - files_cache:/var/cache/riigiluup/files
    healthcheck:
      # Only /health is exposed (see application.yml MANAGEMENT_ENDPOINTS_INCLUDE). busybox wget
      # ships in the JRE-alpine runtime; grep guards against a 503 body (Actuator reports DOWN as 503).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Boot takes ~30 s and the photo-cache warm runs right after; don't flag unhealthy meanwhile.
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      files-cache-init:
        condition: service_completed_successfully

  web:
    build: ../frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Only wait for api to have STARTED, not be healthy: the static SPA must come up even when the
    # API is degraded (bad migration, DB hiccup) so visitors get the shell + an "unavailable" state
    # instead of a total outage. The SPA already degrades to empty/error states on fetch failure.
    depends_on:
      api:
        condition: service_started

  # Privacy-first analytics (no cookies, no personal data, self-hosted). Reuses the
  # existing Postgres (separate `umami` database) and is served on its own origin,
  # analytics.<domain>, via nginx (the prebuilt image only serves from the root path).
  umami:
    # Pinned by digest (postgresql-latest as of 2026-08-17) for reproducibility; a floating tag
    # could silently swap in a breaking version on redeploy. Bump deliberately when upgrading.
    image: ghcr.io/umami-software/umami@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/riigiluup.conf:/etc/nginx/conf.d/riigiluup.conf:ro
      # Private-beta password file. MUST exist before `up` (a missing bind source makes Docker
      # create a directory and nginx will fail): htpasswd -Bc deploy/nginx/.htpasswd beta
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # The edge must never be gated on api health: nginx serves the ACME challenge path (cert
    # renewal) and the static SPA, so if it waited for a healthy api a bad deploy would also take
    # down TLS renewal and the shell. Proxy calls to a down api simply 502 until it recovers.
    depends_on:
      web:
        condition: service_started

  certbot:
    # Pinned by digest (certbot:latest as of 2026-08-17): a floating tag here is the highest-risk
    # one - a breaking certbot change would silently stop TLS renewal. Bump deliberately.
    image: certbot/certbot@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  # Watches only containers labelled autoheal=true (currently just api) and runs `docker restart`
  # when Docker marks them 'unhealthy'. Fills the gap Compose leaves: restart: unless-stopped only
  # reacts to a crash/exit, not to a process that is alive but wedged (api replying DOWN to its
  # healthcheck). Needs the Docker socket to issue restarts — that grants Docker-daemon control, so
  # it is scoped by label and nothing else. The api start_period already prevents boot-time flapping.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    mem_limit: 32m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal      # only containers with autoheal=true
      AUTOHEAL_INTERVAL: 10                    # check health every 10s
      AUTOHEAL_START_PERIOD: 0                 # per-container start_period gates boot already
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 20        # graceful stop window (matches api's shutdown)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db_data:
  letsencrypt:
  certbot_webroot:
  files_cache:
