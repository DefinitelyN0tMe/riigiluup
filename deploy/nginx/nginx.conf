user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml text/xml application/ld+json application/manifest+json;
  gzip_vary on;
  gzip_min_length 1024;

  # Anonymise client IPs in the access log (GDPR data-minimisation): drop the last IPv4 octet /
  # truncate IPv6 to /32. The rate limiter still sees the real IP (via X-Real-IP to the api), this
  # only affects what is written to the log.
  map $remote_addr $ip_anon {
    default                          "0.0.0.0";
    "~(?P<ip>\d+\.\d+\.\d+)\.\d+"     "$ip.0";
    "~(?P<ip>[^:]+:[^:]+):"           "$ip::";
  }

  log_format access '$ip_anon - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log access;

  # Let social-media link-preview crawlers past the private-beta password gate for the PUBLIC
  # frontend only (index.html + og-image), so a shared link renders a preview card. Humans still
  # get the password prompt; /api/ (all data) stays gated at the server level, so even a spoofed
  # bot user-agent sees only the empty SPA shell, never data. Search engines are deliberately NOT
  # listed, so the noindex intent stays effective. Used as `auth_basic $beta_auth;` in location /.
  map $http_user_agent $beta_auth {
    default "Riigiluup private beta";
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Facebot|WhatsApp|Slackbot|Slack-ImgProxy|Discordbot|LinkedInBot|SkypeUriPreview|vkShare|Mastodon|Pinterest|redditbot|SignalBot)" "off";
  }

  # On entity DETAIL paths, route crawlers to the api's per-entity shell; every other UA (humans)
  # goes to the SPA on web. Two groups: (1) social link-preview bots, which need the entity's og:
  # tags for a distinct card; (2) search and AI-assistant crawlers, most of which do not run
  # JavaScript and would otherwise read an empty SPA shell. The api shell carries the same facts the
  # page shows (static text + JSON-LD) and is still the full SPA, so it is equivalent content, not a
  # different page. If the api is down, the location falls back to web (see riigiluup.conf).
  map $http_user_agent $og_upstream {
    default "web:80";
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Facebot|WhatsApp|Slackbot|Slack-ImgProxy|Discordbot|LinkedInBot|SkypeUriPreview|vkShare|Mastodon|Pinterest|redditbot|SignalBot)" "api:8080";
    "~*(OAI-SearchBot|ChatGPT-User|GPTBot|PerplexityBot|Perplexity-User|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|Googlebot|Google-InspectionTool|bingbot|Applebot|DuckDuckBot|YandexBot|Amazonbot|meta-externalagent|CCBot|MistralAI-User)" "api:8080";
  }
  # Docker's embedded DNS, so the variable proxy_pass ($og_upstream) resolves at request time.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Per-IP request budget for the pages the api renders for crawlers. Keyed only for requests that
  # are actually routed to the api (crawler/preview UAs): humans on the same paths get an empty key,
  # which nginx never limits. Without this any client sending a "Googlebot" UA could keep the two
  # CPUs busy rendering 12k uncached pages. A real crawler that exceeds it gets 429 and slows down.
  map $og_upstream $crawl_key {
    default     "";
    "api:8080"  $binary_remote_addr;
  }
  limit_req_zone $crawl_key zone=crawl:10m rate=8r/s;
  # The sitemap is ~1 MB; nobody needs it more than now and then.
  limit_req_zone $binary_remote_addr zone=sitemap:1m rate=1r/s;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
