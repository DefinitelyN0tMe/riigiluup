user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;
  gzip_min_length 1024;

  # Anonymise client IPs in the access log (GDPR data-minimisation): drop the last IPv4 octet /
  # truncate IPv6 to /32. The rate limiter still sees the real IP (via X-Real-IP to the api), this
  # only affects what is written to the log.
  map $remote_addr $ip_anon {
    default                          "0.0.0.0";
    "~(?P<ip>\d+\.\d+\.\d+)\.\d+"     "$ip.0";
    "~(?P<ip>[^:]+:[^:]+):"           "$ip::";
  }

  log_format access '$ip_anon - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log access;

  # Let social-media link-preview crawlers past the private-beta password gate for the PUBLIC
  # frontend only (index.html + og-image), so a shared link renders a preview card. Humans still
  # get the password prompt; /api/ (all data) stays gated at the server level, so even a spoofed
  # bot user-agent sees only the empty SPA shell, never data. Search engines are deliberately NOT
  # listed, so the noindex intent stays effective. Used as `auth_basic $beta_auth;` in location /.
  map $http_user_agent $beta_auth {
    default "Riigiluup private beta";
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Facebot|WhatsApp|Slackbot|Slack-ImgProxy|Discordbot|LinkedInBot|SkypeUriPreview|vkShare|Mastodon|Pinterest|redditbot|SignalBot)" "off";
  }

  # X-Robots-Tag per user-agent: the private-beta default forbids indexing AND snippets/images,
  # but nosnippet/noimageindex also suppress link-preview cards. Send the preview crawlers an
  # empty value (nginx omits the header when the value is empty) so their card can render; real
  # search engines still get the full restrictive header (and are blocked by the auth gate anyway).
  map $http_user_agent $robots_tag {
    default "noindex, nofollow, noarchive, nosnippet, noimageindex";
    "~*(TelegramBot|Twitterbot|facebookexternalhit|Facebot|WhatsApp|Slackbot|Slack-ImgProxy|Discordbot|LinkedInBot|SkypeUriPreview|vkShare|Mastodon|Pinterest|redditbot|SignalBot)" "";
  }

  include /etc/nginx/conf.d/*.conf;
}
