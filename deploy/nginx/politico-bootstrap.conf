# Bootstrap-only config used BEFORE the first Let's Encrypt certificate exists.
# After scripts/issue-cert.sh succeeds, symlink politico.conf → politico-ssl.conf
# and reload nginx.
server {
  listen 80;
  server_name POLITICO_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass         http://web:80;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Block public scraping of Prometheus metrics — internal Docker network only.
  location = /actuator/prometheus { deny all; return 403; }

  location /api/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }
}
