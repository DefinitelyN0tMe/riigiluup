# HTTP → HTTPS (canonical apex) + Let's Encrypt HTTP-01 challenge
server {
  listen 80 default_server;
  server_name riigiluup.ee www.riigiluup.ee;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Canonicalise to the apex host over HTTPS in a single hop (drops www).
  location / {
    return 301 https://riigiluup.ee$request_uri;
  }
}

# HTTPS www → canonical apex. One canonical host means OAuth only ever uses the
# apex redirect_uri, and avoids duplicate-content / split-cookie issues.
server {
  listen 443 ssl;
  http2 on;
  server_name www.riigiluup.ee;

  ssl_certificate     /etc/letsencrypt/live/riigiluup.ee/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/riigiluup.ee/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  return 301 https://riigiluup.ee$request_uri;
}

# HTTPS main (canonical apex host)
server {
  listen 443 ssl default_server;
  http2 on;
  server_name riigiluup.ee;

  ssl_certificate     /etc/letsencrypt/live/riigiluup.ee/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/riigiluup.ee/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # The Umami tracker (/stats.js) and its /api/send beacon are same-origin, so 'self' covers them.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
  # Private beta: tell crawlers not to index/follow/archive. Per-UA (see $robots_tag map): social
  # preview crawlers get an empty value (header omitted) so their card renders; everyone else gets
  # the full restrictive set. `always` puts it on the 401 challenge too.
  add_header X-Robots-Tag $robots_tag always;

  # --- PRIVATE-BETA GATE ---------------------------------------------------------------------
  # One shared password guards the ENTIRE site (SPA + API + admin) before anything reaches the
  # app, so crawlers/scrapers get 401 and never see content. Generate the file with:
  #   htpasswd -Bc deploy/nginx/.htpasswd beta        (bcrypt; -B). Repeat without -c to add users.
  # It is bind-mounted read-only in docker-compose.prod.yml and gitignored (never commit the hash).
  # TO GO FULLY PUBLIC: delete these two lines (and flip frontend/public/robots.txt back).
  auth_basic           "Riigiluup — private beta";
  auth_basic_user_file /etc/nginx/.htpasswd;

  client_max_body_size 4m;

  # Block public scraping of Prometheus metrics — internal Docker network only.
  location = /actuator/prometheus { deny all; return 403; }

  # --- Self-hosted analytics (Umami), collection endpoints only ------------------------------
  # Umami runs internal-only; the dashboard is read via the admin panel (backend proxy behind
  # OIDC). Only these two exact paths are public: the tracker script and its beacon. Exact-match
  # (=) locations win over the /api/ prefix below, so /api/send goes to Umami, not Spring.
  location = /stats.js {
    proxy_pass         http://umami:3000/script.js;
    proxy_set_header   Host              $host;
    proxy_hide_header  Set-Cookie;                 # defence in depth: Umami is cookieless anyway
  }
  location = /api/send {
    proxy_pass         http://umami:3000/api/send;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_hide_header  Set-Cookie;
  }

  # API (proxied to Spring Boot)
  location /api/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # OIDC endpoints (Spring Security OAuth2 client): auth redirect + callback.
  location /oauth2/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location /login/oauth2/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA static assets. Override the server-level gate with the UA-aware variable ($beta_auth):
  # social-media preview crawlers get "off" and pass through, so a shared link renders a preview
  # card; every human still needs the password. Data stays protected because /api/ above keeps the
  # unconditional server-level auth_basic, so a spoofed bot UA reaches only the empty SPA shell.
  location / {
    auth_basic           $beta_auth;
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass         http://web:80;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
