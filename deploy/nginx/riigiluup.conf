# HTTP → HTTPS (canonical apex) + Let's Encrypt HTTP-01 challenge
server {
  listen 80 default_server;
  server_name RIIGILUUP_DOMAIN www.RIIGILUUP_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Canonicalise to the apex host over HTTPS in a single hop (drops www).
  location / {
    return 301 https://RIIGILUUP_DOMAIN$request_uri;
  }
}

# HTTPS www → canonical apex. One canonical host means OAuth only ever uses the
# apex redirect_uri, and avoids duplicate-content / split-cookie issues.
server {
  listen 443 ssl;
  http2 on;
  server_name www.RIIGILUUP_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/RIIGILUUP_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/RIIGILUUP_DOMAIN/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  return 301 https://RIIGILUUP_DOMAIN$request_uri;
}

# HTTPS main (canonical apex host)
server {
  listen 443 ssl default_server;
  http2 on;
  server_name RIIGILUUP_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/RIIGILUUP_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/RIIGILUUP_DOMAIN/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # analytics.<domain> is allowed for script-src (Umami tracker) and connect-src (its /api/send beacon).
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self' https://analytics.RIIGILUUP_DOMAIN; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://analytics.RIIGILUUP_DOMAIN; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
  # Private beta: tell every crawler not to index/follow/archive anything. `always` puts it on
  # the 401 challenge too. Redundant with the auth gate below, but harmless if auth is ever lifted.
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

  # --- PRIVATE-BETA GATE ---------------------------------------------------------------------
  # One shared password guards the ENTIRE site (SPA + API + admin) before anything reaches the
  # app, so crawlers/scrapers get 401 and never see content. Generate the file with:
  #   htpasswd -Bc deploy/nginx/.htpasswd beta        (bcrypt; -B). Repeat without -c to add users.
  # It is bind-mounted read-only in docker-compose.prod.yml and gitignored (never commit the hash).
  # TO GO FULLY PUBLIC: delete these two lines (and flip frontend/public/robots.txt back).
  auth_basic           "Riigiluup — private beta";
  auth_basic_user_file /etc/nginx/.htpasswd;

  client_max_body_size 4m;

  # Block public scraping of Prometheus metrics — internal Docker network only.
  location = /actuator/prometheus { deny all; return 403; }

  # API (proxied to Spring Boot)
  location /api/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # OIDC endpoints (Spring Security OAuth2 client): auth redirect + callback.
  location /oauth2/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location /login/oauth2/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA static assets
  location / {
    proxy_pass         http://web:80;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

# ============================================================================
# Self-hosted analytics on its own origin (analytics.<domain>). A separate host
# is required because the prebuilt Umami image serves from the root path (/api,
# /_next), which would collide with the SPA and the Spring API under one domain.
# ============================================================================

# HTTP: ACME challenge + redirect to HTTPS
server {
  listen 80;
  server_name analytics.RIIGILUUP_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://analytics.RIIGILUUP_DOMAIN$request_uri;
  }
}

# HTTPS: reverse-proxy to Umami (shares the riigiluup.ee certificate lineage,
# which must be --expand-ed to include analytics.<domain>).
server {
  listen 443 ssl;
  http2 on;
  server_name analytics.RIIGILUUP_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/RIIGILUUP_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/RIIGILUUP_DOMAIN/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 1m;

  location / {
    proxy_pass         http://umami:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
