# HTTP → HTTPS redirect + Let's Encrypt HTTP-01 challenge
server {
  listen 80;
  server_name RIIGILUUP_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS main
server {
  listen 443 ssl;
  http2 on;
  server_name RIIGILUUP_DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/RIIGILUUP_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/RIIGILUUP_DOMAIN/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
  # Private beta: tell every crawler not to index/follow/archive anything. `always` puts it on
  # the 401 challenge too. Redundant with the auth gate below, but harmless if auth is ever lifted.
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

  # --- PRIVATE-BETA GATE ---------------------------------------------------------------------
  # One shared password guards the ENTIRE site (SPA + API + admin) before anything reaches the
  # app, so crawlers/scrapers get 401 and never see content. Generate the file with:
  #   htpasswd -Bc deploy/nginx/.htpasswd beta        (bcrypt; -B). Repeat without -c to add users.
  # It is bind-mounted read-only in docker-compose.prod.yml and gitignored (never commit the hash).
  # TO GO FULLY PUBLIC: delete these two lines (and flip frontend/public/robots.txt back).
  auth_basic           "Riigiluup — private beta";
  auth_basic_user_file /etc/nginx/.htpasswd;

  client_max_body_size 4m;

  # Block public scraping of Prometheus metrics — internal Docker network only.
  location = /actuator/prometheus { deny all; return 403; }

  # API (proxied to Spring Boot)
  location /api/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # OIDC endpoints (Spring Security OAuth2 client): auth redirect + callback.
  location /oauth2/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
  location /login/oauth2/ {
    proxy_pass         http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA static assets
  location / {
    proxy_pass         http://web:80;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}
