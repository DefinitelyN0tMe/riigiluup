# Monthly dependency + base-image update PRs so security fixes surface on a site that runs
# unattended for months, without flooding a solo maintainer. Each ecosystem gets ONE grouped PR of
# minor and patch updates only: mixing a major (e.g. Spring Boot 4, Vite 8) into the same PR made
# every group PR fail and nothing could be merged. Majors are ignored here and upgraded by hand,
# with the full test suite. Security updates are raised separately regardless.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      frontend:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      backend:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      docker-backend:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      docker-frontend:
        update-types: ["minor", "patch"]
    ignore:
      # nginx odd minors (1.29, 1.31, ...) are the mainline branch; stay on the stable line.
      - dependency-name: "nginx"
        versions: ["1.29.x", "1.31.x", "1.33.x"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images pinned in the production compose file (edge nginx, postgres, umami, certbot, autoheal).
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      docker-compose:
        update-types: ["minor", "patch"]
    ignore:
      # nginx odd minors (1.29, 1.31, ...) are the mainline branch; stay on the stable line.
      - dependency-name: "nginx"
        versions: ["1.29.x", "1.31.x", "1.33.x"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
