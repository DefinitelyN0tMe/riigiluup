name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (compile + unit tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute on gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Compile
        working-directory: backend
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Unit tests (fast group only — skip @Tag("slow") + @Tag("integration"))
        working-directory: backend
        run: ./gradlew --no-daemon test jacocoTestReport

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/build/reports/jacoco/test/
          retention-days: 7

      - name: Integration tests (Testcontainers — @Tag("integration"))
        working-directory: backend
        # ubuntu-24.04 runners ship with Docker; Testcontainers picks it up.
        run: ./gradlew --no-daemon integrationTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/tests/integrationTest/

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Bundle size budget (main index JS <= 500KB uncompressed)
        working-directory: frontend
        run: |
          MAIN_JS=$(ls dist/assets/index-*.js | head -1)
          SIZE=$(stat -c%s "$MAIN_JS")
          echo "Main JS: $MAIN_JS ($SIZE bytes)"
          if [ "$SIZE" -gt 500000 ]; then
            echo "::error::Main JS bundle $MAIN_JS is $SIZE bytes, exceeds 500KB budget"
            exit 1
          fi

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-report
          path: frontend/dist/bundle-report.html
          retention-days: 30

  e2e:
    name: Frontend E2E (Playwright smoke)
    # TODO: enable once the API seed / migration pipeline runs headlessly in CI.
    # Local `npm run test:e2e` works against a running dev stack (docker compose up).
    if: false
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: riigiluup
          POSTGRES_USER: riigiluup
          POSTGRES_PASSWORD: riigiluup
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U riigiluup -d riigiluup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:15432/riigiluup
          DB_USER: riigiluup
          DB_PASSWORD: riigiluup
          SERVER_PORT: "18080"
          SPRING_PROFILES_ACTIVE: local
        run: |
          chmod +x gradlew
          nohup ./gradlew --no-daemon bootRun > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/actuator/health > /dev/null; then
              echo "backend up"; break
            fi
            sleep 2
          done

      - name: Start frontend preview
        working-directory: frontend
        run: |
          nohup npx vite preview --port 5173 --host > preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "frontend up"; break
            fi
            sleep 1
          done

      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
