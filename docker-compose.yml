## Dev compose. Shared env-var names with deploy/docker-compose.prod.yml so a single
## .env file (see deploy/.env.example) drives both stacks. Sensible dev defaults are
## baked in via `${VAR:-default}` so `docker compose up` works with no .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-politico}
      POSTGRES_USER: ${POSTGRES_USER:-politico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-politico}
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-politico} -d ${POSTGRES_DB:-politico}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-politico}
      DB_USER: ${POSTGRES_USER:-politico}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-politico}
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      POLITICO_ADMIN_ALLOWED_EMAILS: ${POLITICO_ADMIN_ALLOWED_EMAILS:-riigiluup@gmail.com}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
