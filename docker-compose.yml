services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: politico
      POSTGRES_USER: politico
      POSTGRES_PASSWORD: politico
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politico -d politico"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
