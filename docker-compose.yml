## Dev compose. Shared env-var names with deploy/docker-compose.prod.yml so a single
## .env file (see deploy/.env.example) drives both stacks. Sensible dev defaults are
## baked in via `${VAR:-default}` so `docker compose up` works with no .env.
services:
  db:
    image: postgres:16-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riigiluup}
      POSTGRES_USER: ${POSTGRES_USER:-riigiluup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riigiluup}
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riigiluup} -d ${POSTGRES_DB:-riigiluup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-riigiluup}
      DB_USER: ${POSTGRES_USER:-riigiluup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-riigiluup}
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      RIIGILUUP_ADMIN_ALLOWED_EMAILS: ${RIIGILUUP_ADMIN_ALLOWED_EMAILS:-you@example.com}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
