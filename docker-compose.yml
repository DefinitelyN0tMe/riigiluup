services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: politico
      POSTGRES_USER: politico
      POSTGRES_PASSWORD: politico
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politico -d politico"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/politico
      DB_USER: politico
      DB_PASSWORD: politico
      SERVER_PORT: "8080"
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
